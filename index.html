<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Kalender</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1f2430;--mu:#6b7280;--ln:#e5e7eb;--ac:#4f8cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--cd:#181c25;--tx:#e8ebf2;--mu:#9aa3b2;--ln:#2a3040}}
:root[data-theme="dark"]{--bg:#0f1218;--cd:#181c25;--tx:#e8ebf2;--mu:#9aa3b2;--ln:#2a3040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 8px}h3{font-size:15px}h2{font-size:20px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
button{font:inherit}
.m{color:var(--mu)}.sm{font-size:12px}.pd{padding:20px}.gr{flex:1}.sp{flex:1}
.card{background:var(--cd);border-radius:14px;padding:16px;border:1px solid var(--ln);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.b{padding:9px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);cursor:pointer}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.b.d{background:#ef4444;border-color:#ef4444;color:#fff}.b.g{background:transparent}.b.wd{width:100%;padding:12px}
.ic{background:none;border:none;color:var(--tx);cursor:pointer;font-size:16px;padding:4px 8px}.ic.bg{font-size:24px;line-height:1}
.tb{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--ln)}
.ly{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;align-items:start}
.sd{display:flex;flex-direction:column;gap:16px}
.tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tl h2{margin:0 8px}.tl .sr{width:150px}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.seg button{border:none;background:none;color:var(--tx);padding:8px 12px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.gm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.dw{background:var(--cd);text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:var(--mu)}
.ce{background:var(--cd);min-height:96px;padding:4px;cursor:pointer;overflow:hidden}.ce.ot{opacity:.45}
.nu{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-size:12px}
.td .nu{background:var(--ac);color:#fff}
.ch{color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mo{font-size:11px;color:var(--mu);margin-top:2px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.co{border:1px solid var(--ln);border-radius:12px;padding:8px;min-height:300px;cursor:pointer}
.ch2{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);margin-bottom:6px}
.ad{margin-bottom:14px}.adt{font-weight:600;margin-bottom:6px}
.rw{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;cursor:pointer}.tm2{font-size:13px;color:var(--mu);min-width:110px}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx);padding:3px 0}.ck input{width:auto}
.stk{display:flex;flex-direction:column;gap:8px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{margin-bottom:12px}.ph{display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:linear-gradient(90deg,#4f8cff,#a855f7)}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.fl{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lp{border:2px solid var(--c);background:transparent;border-radius:20px;padding:4px 12px;color:var(--tx);cursor:pointer;font-size:13px}.lp.on{background:var(--c);color:#fff}
.ac{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.aw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.au{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}.er{color:#ef4444;font-size:13px}
@media(max-width:900px){.ly{grid-template-columns:1fr}.wk{grid-template-columns:1fr}.co{min-height:0}.ce{min-height:64px}.ch b{display:none}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== HIER DEINE SUPABASE-DATEN EINTRAGEN ===== */
const SUPABASE_URL='https://pmlcstqpmmoiqnvfxspl.supabase.co',SUPABASE_KEY='sb_publishable_kx4UGLboJuhwN6P3JcbNZg_-39zZoZV';
const CONFIG_OK=!SUPABASE_URL.includes('HIER');
const sb=CONFIG_OK?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=s=>document.querySelector(s);
const L=[['work','Arbeit','#4f8cff'],['private','Privat','#34c38f'],['family','Familie','#f59e0b'],['important','Wichtig','#ef4444'],['sport','Sport','#a855f7'],['other','Sonstiges','#64748b']];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'],WL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const R=[['none','Keine Wiederholung'],['daily','Täglich'],['weekly','Wöchentlich'],['monthly','Monatlich'],['yearly','Jährlich']];
const col=id=>(L.find(l=>l[0]==id)||[])[2]||'#64748b';
const ld=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pk=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const ad=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const df=(a,b)=>Math.round((pk(b)-pk(a))/864e5),mon=d=>ad(d,-((d.getDay()+6)%7));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36),T=()=>key(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function hash(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return btoa(unescape(encodeURIComponent(t)))}}
function occ(e,k){if(k<e.date)return false;if(e.rep=='none')return k<=e.endDate;if(k==e.date)return true;const d=pk(k),s=pk(e.date);
 if(e.rep=='daily')return true;if(e.rep=='weekly')return df(e.date,k)%7==0;if(e.rep=='monthly')return d.getDate()==s.getDate();return d.getDate()==s.getDate()&&d.getMonth()==s.getMonth()}
const S={users:[],events:[],view:'month',cur:new Date(),hidden:[],q:'',ed:null,dark:ld('cal_dark',null),err:'',mode:'login',nm:'',periods:[],msg:'Lade deinen Kalender …',saveErr:false,names:{},info:''};
S.user=null;
const isDark=()=>S.dark??matchMedia('(prefers-color-scheme: dark)').matches;
const theme=()=>{if(S.dark!==null)document.documentElement.dataset.theme=S.dark?'dark':'light'};
const blank=k=>({id:uid(),owner:S.user.id,title:'',desc:'',loc:'',date:k,endDate:k,allDay:false,start:'09:00',end:'10:00',label:'work',rep:'none',shared:[]});
const cmp=(a,b)=>a.allDay==b.allDay?a.start.localeCompare(b.start):a.allDay?-1:1;
const evs=()=>{const q=S.q.toLowerCase();return S.events.filter(e=>(e.owner==S.user.id||e.shared.includes(S.user.id))&&!S.hidden.includes(e.label)&&(!q||(e.title+' '+e.desc+' '+e.loc).toLowerCase().includes(q)))};
const on=k=>evs().filter(e=>occ(e,k)).sort(cmp);
const chip=e=>`<div class="ch" data-a="edit" data-id="${e.id}" style="background:${col(e.label)}">${e.allDay?'':'<b>'+e.start+'</b> '}${esc(e.title)||'(Ohne Titel)'}${e.shared.length||e.owner!=S.user.id?' 👥':''}</div>`;
const auth=()=>`<div class="aw"><div class="card au"><h1>📅 Mein Kalender</h1><p class="m">${S.mode=='login'?'Melde dich an':'Neues Konto erstellen'}</p><input id="un" placeholder="Benutzername"><input id="pw" type="password" placeholder="Passwort">${S.err?`<div class="er">${S.err}</div>`:''}<button class="b p" data-a="auth">${S.mode=='login'?'Anmelden':'Registrieren'}</button><button class="b g" data-a="mode">${S.mode=='login'?'Noch kein Konto? Registrieren':'Schon ein Konto? Anmelden'}</button></div></div>`;
const month=()=>{const f=mon(new Date(S.cur.getFullYear(),S.cur.getMonth(),1)),t=T();let h='<div class="gm">'+WD.map(d=>`<div class="dw">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=ad(f,i),k=key(d),l=on(k);h+=`<div class="ce${d.getMonth()!=S.cur.getMonth()?' ot':''}${k==t?' td':''}" data-a="new" data-k="${k}"><span class="nu">${d.getDate()}</span>${l.slice(0,3).map(chip).join('')}${l.length>3?`<div class="mo">+${l.length-3} weitere</div>`:''}</div>`}return h+'</div>'};
const week=()=>{const m=mon(S.cur),t=T();return'<div class="wk">'+[0,1,2,3,4,5,6].map(i=>{const d=ad(m,i),k=key(d);return`<div class="co${k==t?' td':''}" data-a="new" data-k="${k}"><div class="ch2"><span>${WD[i]}</span><span class="nu">${d.getDate()}</span></div>${on(k).map(chip).join('')}</div>`}).join('')+'</div>'};
const agenda=()=>{let h='';for(let i=0;i<60;i++){const d=ad(S.cur,i),k=key(d),l=on(k);if(!l.length)continue;
 h+=`<div class="ad"><div class="adt"><b>${d.getDate()}.</b> ${MO[d.getMonth()]} · ${WL[(d.getDay()+6)%7]}</div>${l.map(e=>`<div class="rw" data-a="edit" data-id="${e.id}"><span class="dt" style="background:${col(e.label)}"></span><span class="tm2">${e.allDay?'Ganztägig':e.start+' – '+e.end}</span><span class="gr">${esc(e.title)}</span>${e.loc?`<span class="m sm">📍 ${esc(e.loc)}</span>`:''}</div>`).join('')}</div>`}
 return h||'<p class="m pd">Keine Termine in den nächsten 60 Tagen.</p>'};
const per=p=>{const t=T(),tot=df(p.start,p.end)+1,el=Math.min(tot,Math.max(0,df(p.start,t)+1)),left=tot-el,pc=Math.round(el/tot*100);
 return`<div class="pr"><div class="ph"><b>${esc(p.name)}</b><button class="ic" data-a="pdel" data-id="${p.id}">✕</button></div><div class="bar"><div style="width:${pc}%"></div></div><div class="sm m">${pc}% erreicht · ${t<p.start?'startet in '+df(t,p.start)+' Tagen':left+(left==1?' Resttag':' Resttage')} (${el}/${tot} Tage)</div></div>`};
const modal=()=>{const e=S.ed.ev,ro=e.owner!=S.user.id,own=S.users.find(u=>u.id==e.owner),oth=S.users.filter(u=>u.id!=S.user.id);
 return`<div class="mb" data-a="close"><div class="card md" data-a="stop"><h2>${S.ed.isNew?'Neuer Termin':ro?'Geteilter Termin':'Termin bearbeiten'}</h2>${ro?`<p class="m sm">Geteilt von ${esc(own?own.name:'Unbekannt')} (nur Ansicht)</p>`:''}
<fieldset class="fl" ${ro?'disabled':''}><input id="t" placeholder="Titel" value="${esc(e.title)}" style="font-size:18px;font-weight:600">
<div class="two"><label>Von<input id="d1" type="date" value="${e.date}"></label><label>Bis<input id="d2" type="date" value="${e.endDate}"></label></div>
<label class="ck"><input id="al" type="checkbox" data-a="ad" ${e.allDay?'checked':''}> Ganztägig</label>
<div class="two" id="tm" ${e.allDay?'hidden':''}><label>Start<input id="s1" type="time" value="${e.start}"></label><label>Ende<input id="s2" type="time" value="${e.end}"></label></div>
<label>Wiederholung<select id="rp">${R.map(r=>`<option value="${r[0]}" ${e.rep==r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></label>
<div><div class="sm m">Label</div><div class="lbs">${L.map(l=>`<button type="button" class="lp${e.label==l[0]?' on':''}" style="--c:${l[2]}" data-a="pick" data-id="${l[0]}">${l[1]}</button>`).join('')}</div></div>
<input id="lo" placeholder="Ort" value="${esc(e.loc)}"><textarea id="ds" rows="3" placeholder="Beschreibung">${esc(e.desc)}</textarea>
<div><div class="sm m">Teilen mit</div><input id="shn" placeholder="Benutzernamen, mit Komma getrennt" value="${esc(e.shared.map(i=>S.names[i]||'').filter(Boolean).join(', '))}"></div></fieldset>
<div class="ac">${!S.ed.isNew&&!ro?'<button class="b d" data-a="del">Löschen</button>':''}${ro?'<button class="b d" data-a="leave">Aus meinem Kalender entfernen</button>':''}<span class="sp"></span><button class="b g" data-a="close">Abbrechen</button>${ro?'':'<button class="b p" data-a="save">Speichern</button>'}</div></div></div>`};
function render(){const app=$('#app');if(!S.user){app.innerHTML=authv();return}
 const w=S.view=='week',m=mon(S.cur),s=ad(m,6);
 const hd=w?`${m.getDate()}. ${MO[m.getMonth()]} – ${s.getDate()}. ${MO[s.getMonth()]} ${s.getFullYear()}`:`${MO[S.cur.getMonth()]} ${S.cur.getFullYear()}`;
 app.innerHTML=`<header class="tb"><b>📅 Mein Kalender</b><span class="sp"></span>${S.saveErr?'<span class="er">⚠ Nicht gespeichert</span>':''}<span class="m">👤 ${esc(S.user.name)}</span><button class="b g" data-a="dark">${isDark()?'☀️':'🌙'}</button><button class="b g" data-a="out">Abmelden</button></header>
<div class="ly"><aside class="sd"><button class="b p wd" data-a="new">+ Neuer Termin</button>
<div class="card"><h3>Labels</h3>${L.map(l=>`<label class="ck"><input type="checkbox" data-a="lab" data-id="${l[0]}" ${S.hidden.includes(l[0])?'':'checked'}><span class="dt" style="background:${l[2]}"></span> ${l[1]}</label>`).join('')}</div>
<div class="card"><h3>Zeiträume</h3>${S.periods.length?S.periods.map(per).join(''):'<p class="m sm">Noch kein Zeitraum angelegt.</p>'}<div class="stk"><input id="pn" placeholder="Name (z. B. Projekt)"><div class="two"><input id="ps" type="date" value="${T()}"><input id="pe" type="date" value="${key(ad(new Date(),30))}"></div><button class="b" data-a="padd">+ Zeitraum hinzufügen</button></div></div></aside>
<section class="card"><div class="tl"><button class="b" data-a="today">Heute</button><button class="ic bg" data-a="prev">‹</button><button class="ic bg" data-a="next">›</button><h2>${hd}</h2><span class="sp"></span><input id="q" class="sr" placeholder="🔍 Suchen" value="${esc(S.q)}"><div class="seg">${[['month','Monat'],['week','Woche'],['agenda','Liste']].map(v=>`<button class="${S.view==v[0]?'on':''}" data-a="view" data-id="${v[0]}">${v[1]}</button>`).join('')}</div></div>${S.view=='month'?month():w?week():agenda()}</section></div>${S.ed?modal():''}`}
let snap={ev:{},pe:{}},q=Promise.resolve();
async function sync(){try{
 for(const e of S.events){if(e.owner!=S.user.id)continue;const j=JSON.stringify(e);if(snap.ev[e.id]!=j){const{id,owner,shared,...data}=e;const{error}=await sb.from('events').upsert({id,owner,shared,data});if(error)throw error;snap.ev[e.id]=j}}
 for(const id of Object.keys(snap.ev))if(!S.events.some(e=>e.id==id)){const{error}=await sb.from('events').delete().eq('id',id);if(error)throw error;delete snap.ev[id]}
 for(const p of S.periods){const j=JSON.stringify(p);if(snap.pe[p.id]!=j){const{id,...data}=p;const{error}=await sb.from('periods').upsert({id,owner:S.user.id,data});if(error)throw error;snap.pe[p.id]=j}}
 for(const id of Object.keys(snap.pe))if(!S.periods.some(p=>p.id==id)){const{error}=await sb.from('periods').delete().eq('id',id);if(error)throw error;delete snap.pe[id]}
 if(S.saveErr){S.saveErr=false;render()}}catch(e){S.saveErr=true;render()}}
const save=()=>{q=q.then(sync)};
function login(u){S.user=u;S.err='';sv('cal_session',u.id);S.periods=ld('cal_periods_'+u.id,[]);render()}
const mv=d=>{S.cur=S.view=='week'?ad(S.cur,7*d):new Date(S.cur.getFullYear(),S.cur.getMonth()+d,1);render()};
const A={
 stop(){},close(){S.ed=null;render()},mode(){S.mode=S.mode=='login'?'register':'login';S.err='';render()},
 async auth(){const n=$('#un').value.trim(),p=$('#pw').value;S.nm=n;if(!n||p.length<4){S.err='Bitte Namen und ein Passwort mit mindestens 4 Zeichen eingeben.';return render()}
  const h=await hash(p),low=n.toLowerCase();
  if(S.mode=='register'){if(S.users.some(u=>u.name.toLowerCase()==low)){S.err='Dieser Name ist schon vergeben.';return render()}const u={id:uid(),name:n,pass:h};S.users.push(u);sv('cal_users',S.users);login(u)}
  else{const u=S.users.find(x=>x.name.toLowerCase()==low&&x.pass==h);if(!u){S.err='Name oder Passwort ist falsch.';return render()}login(u)}},
 out(){S.user=null;S.ed=null;sv('cal_session',null);render()},
 dark(){S.dark=!isDark();sv('cal_dark',S.dark);theme();render()},
 today(){S.cur=new Date();render()},prev(){mv(-1)},next(){mv(1)},view(el){S.view=el.dataset.id;render()},
 lab(el){const i=el.dataset.id;S.hidden=S.hidden.includes(i)?S.hidden.filter(x=>x!=i):[...S.hidden,i];render()},
 new(el){S.ed={isNew:true,ev:blank(el.dataset.k||T())};render()},
 edit(el){const e=S.events.find(x=>x.id==el.dataset.id);if(e){S.ed={isNew:false,ev:{...e,shared:[...e.shared]}};render()}},
 ad(el){$('#tm').hidden=el.checked},
 pick(el){S.ed.ev.label=el.dataset.id;document.querySelectorAll('.lp').forEach(b=>b.classList.toggle('on',b.dataset.id==el.dataset.id))},
 save(){const e={...S.ed.ev,title:$('#t').value.trim()||'(Ohne Titel)',date:$('#d1').value,endDate:$('#d2').value,allDay:$('#al').checked,start:$('#s1').value||'09:00',end:$('#s2').value||'10:00',rep:$('#rp').value,loc:$('#lo').value,desc:$('#ds').value,shared:[...document.querySelectorAll('.sh:checked')].map(x=>x.value)};
  if(!e.date)return;if(e.rep!='none'||e.endDate<e.date)e.endDate=e.date;if(!e.allDay&&e.endDate==e.date&&e.end<e.start)e.end=e.start;
  const i=S.events.findIndex(x=>x.id==e.id);if(i<0)S.events.push(e);else S.events[i]=e;save();S.ed=null;render()},
 del(){S.events=S.events.filter(x=>x.id!=S.ed.ev.id);save();S.ed=null;render()},
 leave(){const e=S.events.find(x=>x.id==S.ed.ev.id);if(e)e.shared=e.shared.filter(x=>x!=S.user.id);save();S.ed=null;render()},
 padd(){const s=$('#ps').value,e=$('#pe').value;if(!s||!e||e<s)return;S.periods.push({id:uid(),name:$('#pn').value.trim()||'Zeitraum',start:s,end:e});save();render()},
 pdel(el){S.periods=S.periods.filter(p=>p.id!=el.dataset.id);save();render()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('change',ev=>{if(ev.target.id=='q'){S.q=ev.target.value;render()}});

theme();
const authv=()=>{const m=S.mode;if(S.msg)return`<div class="aw"><div class="card au"><h1>📅 Mein Kalender</h1><p class="m">${S.msg}</p></div></div>`;
 const t={login:'Melde dich an',register:'Neues Konto erstellen',reset:'Passwort zurücksetzen',newpw:'Neues Passwort festlegen'}[m];
 return`<div class="aw"><div class="card au"><h1>📅 Mein Kalender</h1><p class="m">${t}</p>
${m=='register'?'<input id="un" placeholder="Benutzername (a–z, 0–9, _)" autocapitalize="none" autocomplete="username">':''}
${m!='newpw'?'<input id="em" type="email" placeholder="E-Mail" autocomplete="email">':''}
${m=='reset'?'':'<input id="pw" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="current-password">'}
${S.err?`<div class="er">${esc(S.err)}</div>`:''}${S.info?`<div class="sm m">${esc(S.info)}</div>`:''}
<button class="b p" data-a="auth">${{login:'Anmelden',register:'Registrieren',reset:'Link senden',newpw:'Passwort speichern'}[m]}</button>
${m=='login'?'<button class="b g" data-a="mode" data-id="register">Noch kein Konto? Registrieren</button><button class="b g" data-a="mode" data-id="reset">Passwort vergessen?</button>':m=='newpw'?'':'<button class="b g" data-a="mode" data-id="login">Zurück zur Anmeldung</button>'}</div></div>`};
A.mode=el=>{S.mode=el.dataset.id;S.err='';S.info='';render()};
A.out=()=>{sb.auth.signOut()};
A.auth=async()=>{S.err='';S.info='';const m=S.mode,em=($('#em')||{}).value?.trim(),pw=($('#pw')||{}).value||'',un=(($('#un')||{}).value||'').trim().toLowerCase();
 try{
  if(m=='register'){if(!/^[a-z0-9_]{3,20}$/.test(un))throw'Benutzername: 3–20 Zeichen, nur a–z, 0–9 und _.';if(pw.length<8)throw'Das Passwort braucht mindestens 8 Zeichen.';
   const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un},emailRedirectTo:location.href.split('#')[0]}});if(error)throw error.message;
   if(!data.session){S.info='Fast geschafft: Wir haben dir eine Bestätigungs-Mail geschickt. Klicke auf den Link und melde dich danach an.';S.mode='login'}}
  else if(m=='login'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error.message}
  else if(m=='reset'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});if(error)throw error.message;S.info='Wenn die Adresse bekannt ist, kommt gleich eine Mail mit einem Link.'}
  else if(m=='newpw'){if(pw.length<8)throw'Das Passwort braucht mindestens 8 Zeichen.';const{error}=await sb.auth.updateUser({password:pw});if(error)throw error.message;S.mode='login';history.replaceState(null,'',location.pathname);return start()}
 }catch(e){const t=typeof e=='string'?e:(e&&e.message)||'';
  S.err=/Database error/i.test(t)?'Benutzername oder E-Mail ist schon vergeben.':/already registered/i.test(t)?'Diese E-Mail ist schon registriert.':/Invalid login/i.test(t)?'E-Mail oder Passwort ist falsch.':/not confirmed/i.test(t)?'Bitte bestätige zuerst deine E-Mail-Adresse.':t||'Es ist ein Fehler aufgetreten.'}
 if(!(m=='login'&&!S.err&&!S.info))render()};
A.save=async()=>{const e={...S.ed.ev,title:$('#t').value.trim()||'(Ohne Titel)',date:$('#d1').value,endDate:$('#d2').value,allDay:$('#al').checked,start:$('#s1').value||'09:00',end:$('#s2').value||'10:00',rep:$('#rp').value,loc:$('#lo').value,desc:$('#ds').value};
 if(!e.date)return;if(e.rep!='none'||e.endDate<e.date)e.endDate=e.date;if(!e.allDay&&e.endDate==e.date&&e.end<e.start)e.end=e.start;
 const nm=($('#shn')?$('#shn').value:'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
 if(nm.length){const{data,error}=await sb.from('profiles').select('id,username').in('username',nm);if(error)return alert('Teilen fehlgeschlagen. Bitte versuche es erneut.');
  const miss=nm.filter(n=>!data.some(p=>p.username==n));if(miss.length)return alert('Unbekannte Benutzer: '+miss.join(', '));
  data.forEach(p=>S.names[p.id]=p.username);S.users=Object.entries(S.names).map(([id,name])=>({id,name}));e.shared=data.map(p=>p.id).filter(i=>i!=S.user.id)}else e.shared=[];
 const i=S.events.findIndex(x=>x.id==e.id);if(i<0)S.events.push(e);else S.events[i]=e;save();S.ed=null;render()};
A.leave=async()=>{const id=S.ed.ev.id;await sb.rpc('leave_event',{eid:id});S.events=S.events.filter(x=>x.id!=id);S.ed=null;render()};
async function loadAll(){
 const[ev,pe]=await Promise.all([sb.from('events').select('*'),sb.from('periods').select('*')]);if(ev.error||pe.error)throw ev.error||pe.error;
 S.events=ev.data.map(r=>({...r.data,id:r.id,owner:r.owner,shared:r.shared||[]}));S.periods=pe.data.map(r=>({...r.data,id:r.id}));
 snap={ev:{},pe:{}};S.events.forEach(e=>{if(e.owner==S.user.id)snap.ev[e.id]=JSON.stringify(e)});S.periods.forEach(p=>snap.pe[p.id]=JSON.stringify(p));
 const ids=[...new Set([S.user.id,...S.events.flatMap(e=>[e.owner,...e.shared])])];
 const{data}=await sb.from('profiles').select('id,username').in('id',ids);(data||[]).forEach(p=>S.names[p.id]=p.username);
 S.users=Object.entries(S.names).map(([id,name])=>({id,name}))}
async function start(){S.msg='';if(S.mode=='newpw'){S.user=null;return render()}
 const{data}=await sb.auth.getSession(),ses=data.session;if(!ses){S.user=null;return render()}
 const{data:p}=await sb.from('profiles').select('username').eq('id',ses.user.id).maybeSingle();
 S.user={id:ses.user.id,name:(p&&p.username)||ses.user.email};S.names[S.user.id]=S.user.name;
 try{await loadAll();S.saveErr=false}catch(e){S.saveErr=true}render()}
if(!CONFIG_OK){S.msg='Bitte trage oben in der Datei deine Supabase-URL und den Anon-Key ein.';render()}
else{if(location.hash.includes('type=recovery'))S.mode='newpw';
 sb.auth.onAuthStateChange((ev)=>{if(ev=='PASSWORD_RECOVERY'){S.mode='newpw';S.user=null;S.msg='';render()}else if(ev=='SIGNED_IN'&&!S.user&&S.mode!='newpw')start();else if(ev=='SIGNED_OUT'){S.user=null;S.events=[];S.periods=[];S.mode='login';S.msg='';render()}});
 render();start()}
</script></body></html>
